name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Every directory under apps/ becomes a matrix entry — adding a new app
  # requires no workflow changes.
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "apps=$(ls apps | jq -R -s -c 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      # Full history + tags: build.sh derives versionCode from the commit
      # count and versionName from `git describe`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: androidbase-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No key is committed: build.sh generates a throwaway self-signed one
      # unless these secrets provide a real key.
      - name: Keystore from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          # A missing or mis-pasted secret must never fail the build: without a
          # usable key here, build.sh falls back to a throwaway self-signed one.
          # (The whole job used to die on `base64 -d` of a corrupt secret.)
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set; build.sh will generate a throwaway key."
            exit 0
          fi
          mkdir -p keystore
          # tolerate any whitespace/newlines a pasted secret carries
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > keystore/release.keystore 2>/dev/null \
             || [ ! -s keystore/release.keystore ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 is not valid base64; using a throwaway key (in-place updates break until the secret is re-set)."
            rm -f keystore/release.keystore
            exit 0
          fi
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore/keystore.properties
          storepass="$(sed -n 's/^storePassword=//p' keystore/keystore.properties)"
          if command -v keytool >/dev/null 2>&1 \
             && ! keytool -list -keystore keystore/release.keystore -storepass "$storepass" >/dev/null 2>&1; then
            echo "::warning::keystore decoded but keytool could not open it with the given password; using a throwaway key (in-place updates break until the secrets are re-set)."
            rm -f keystore/release.keystore keystore/keystore.properties
            exit 0
          fi
          echo "Using keystore from repository secrets"

      - name: Build ${{ matrix.app }}
        run: |
          docker image inspect androidbase-builder >/dev/null 2>&1 || echo "::warning::builder image not in docker daemon"
          set -o pipefail
          if ! CONTAINER_ENGINE=docker SKIP_IMAGE_BUILD=1 BUILD_TASK="assembleDebug assembleRelease" ./build.sh "${{ matrix.app }}" 2>&1 | tee /tmp/build.log; then
            # Surface the tail of the log as annotations (visible via API)
            tail -n 10 /tmp/build.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Verify APK signatures
        run: |
          docker run --rm -v "$PWD/output:/out" androidbase-builder sh -c '
            set -e
            for f in /out/*/*.apk; do
              echo "== $f"
              /opt/android-sdk/build-tools/34.0.0/apksigner verify --print-certs "$f" | head -4
            done'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: output/${{ matrix.app }}/*.apk
          if-no-files-found: error

  # Publish the signed APKs as a GitHub Release: a rolling "latest"
  # pre-release for every push to main, a permanent release for v* tags.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          path: apks
          merge-multiple: true

      - name: Publish release
        run: |
          set -euo pipefail
          ls -l apks
          version=$(git describe --tags --match 'v*' --always)
          notes="Signed APKs built from ${GITHUB_SHA} (version ${version#v})."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" apks/*.apk \
              || gh release upload "$GITHUB_REF_NAME" apks/*.apk --clobber
          else
            # Recreate the rolling pre-release so stale assets never linger
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build (${version#v})" --notes "$notes" apks/*.apk
          fi
